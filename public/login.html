<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☀️</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Voltflow</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #0b1220;
        color: #e5e7eb;
        min-height: 100vh;               /* grows & scrolls if the form is taller than the viewport */
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }
      .wrap { width: 100%; max-width: 420px; }
      .brand { text-align: center; margin-bottom: 18px; }
      .brand h1 { margin: 0 0 8px; }
      .brand .logo { display: block; width: 260px; max-width: 80%; height: auto; aspect-ratio: 19 / 6; margin: 0 auto; }
      .brand p { font-size: 14px; color: #94a3b8; margin: 0; }
      /* Hold the embedded Zoho sign-in iframe; force it fluid so no control is clipped. */
      #login { width: 100%; min-height: 480px; }
      #login iframe { width: 100% !important; max-width: 100% !important; border: 0; display: block; }
      .note { margin-top: 16px; text-align: center; font-size: 12px; color: #64748b; }
      @media (max-width: 480px) {
        body { padding: 16px 12px; align-items: flex-start; } /* top-align so a tall form isn't cut off */
        .brand .logo { width: 220px; }
        #login { min-height: 520px; }
      }
    </style>
    <script src="https://static.zohocdn.com/catalyst/sdk/js/4.6.2/catalystWebSDK.js"></script>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <h1>
          <svg class="logo" viewBox="1000 2500 3800 1200" role="img" aria-label="Voltflow">
            <image href="./logo.png" width="6250" height="6250" />
          </svg>
        </h1>
        <p>Sign in to continue</p>
      </div>
      <div id="login"></div>
      <div class="note">Solar EPC Platform · Kenya</div>
    </div>

    <script src="/__catalyst/sdk/init.js"></script>
    <script>
      // This page is the hosted client's homepage (the login screen).
      // If already signed in, go straight to the app. Otherwise embed Zoho's
      // sign-in form; on success Catalyst redirects using "login_redirect"
      // (app.html) from client-package.json — no service_url needed.
      catalyst.auth
        .isUserAuthenticated()
        .then(function () {
          location.replace("/app/app.html");
        })
        .catch(function () {
          catalyst.auth.signIn("login", {});
        });
    </script>
  </body>
</html>
