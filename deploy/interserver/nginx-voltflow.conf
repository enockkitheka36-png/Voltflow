# ============================================================================
# Voltflow — Nginx site config for an InterServer (Ubuntu) VPS
# ----------------------------------------------------------------------------
# Serves the static Vite build and (optionally) reverse-proxies /api/ to the
# local Node assistant server (server/index.js on 127.0.0.1:3001).
#
# INSTALL:
#   sudo cp deploy/interserver/nginx-voltflow.conf /etc/nginx/sites-available/voltflow
#   sudo ln -s /etc/nginx/sites-available/voltflow /etc/nginx/sites-enabled/voltflow
#   sudo rm -f /etc/nginx/sites-enabled/default        # optional: drop the default site
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS:  run `sudo certbot --nginx -d your-domain.com -d www.your-domain.com`
#         Certbot rewrites this file to add the :443 block + HTTP→HTTPS redirect.
#
# >>> Replace EVERY "your-domain.com" below with your real domain (or the VPS IP
#     for an IP-only test, in which case remove server_name or set it to _).
# ============================================================================

server {
    listen 80;
    listen [::]:80;

    # For an IP-only test before DNS is ready, use:  server_name _;
    server_name your-domain.com www.your-domain.com;

    root /var/www/voltflow/dist;
    index index.html;

    # ---- Safe, non-breaking security headers -------------------------------
    # (No strict Content-Security-Policy here: Voltflow uses inline styles and
    #  data: URIs for PDFs/images; a strict CSP can break it. Add a tested CSP
    #  later if desired.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # ---- gzip for text assets ---------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    client_max_body_size 2m;

    # ---- Long-cache the hashed, immutable build assets --------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Assistant API (OPTIONAL) -----------------------------------------
    # Only needed if you run the Node assistant server (PM2). If you deploy
    # STATIC-ONLY, delete this block — the frontend detects the failure and
    # shows the Project Advisor fallback (see deploy/interserver/static-only.md).
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;   # Claude responses can take a few seconds
        proxy_connect_timeout 5s;
    }

    # ---- SPA fallback: every non-file route serves index.html -------------
    # This is what stops a hard refresh on /borehole (or any deep route) 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
